<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Resumen Automático de Video</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light p-4">

  <div class="container">
    <h1 class="mb-4">🎥 Procesador de Videos con Resumen Automático</h1>

    <div class="mb-3">
      <label for="videoInput" class="form-label">📁 Selecciona un video:</label>
      <input type="file" class="form-control" id="videoInput" accept="video/*">
    </div>

    <button class="btn btn-primary" onclick="procesarVideo()">🚀 Procesar</button>

    <div id="loader" class="mt-3 text-info fw-semibold" style="display: none;">
      ⏳ Procesando video, por favor espera...
    </div>

    <div id="resultado" class="mt-5" style="display: none;">
      <h4>📝 Transcripción:</h4>
      <pre id="transcripcionOutput" class="bg-white p-3 border rounded"></pre>
      <button class="btn btn-outline-secondary me-2" onclick="descargarTxt('transcripcion')">⬇ Descargar transcripción</button>

      <h4 class="mt-4">📄 Resumen:</h4>
      <pre id="resumenOutput" class="bg-white p-3 border rounded"></pre>
      <button class="btn btn-outline-secondary" onclick="descargarTxt('resumen')">⬇ Descargar resumen</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
