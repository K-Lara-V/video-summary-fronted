<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Resumen Automático de Video</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light p-4">

  <div class="container">
    <h1 class="mb-4">Procesador de Videos con Resumen Automático</h1>

    <div class="mb-3">
      <label for="videoInput" class="form-label">Selecciona un video (.mp4, .mov, etc.):</label>
      <input type="file" class="form-control" id="videoInput" accept="video/*">
    </div>

    <button class="btn btn-primary" onclick="procesarVideo()">Procesar</button>

    <div id="resultado" class="mt-5">
      <h4>Resultado:</h4>
      <pre id="output" class="bg-white p-3 border rounded" style="white-space: pre-wrap;"></pre>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
